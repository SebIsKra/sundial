<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sundial: Sunny drinks</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" type="text/css" href="/styles.css">
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card mt-4">
                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h1 class="card-title mb-0">Sundial</h1>
                        <a href="/favorites" class="btn btn-secondary btn-sm">Favorites</a>
                    </div>

                    <form action="/weather" method="get" id="weatherForm">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <input type="text" class="form-control" id="lat" name="lat"
                                       placeholder="Latitude (e.g. 52.2297)" required>
                            </div>
                            <div class="form-group col-md-6">
                                <input type="text" class="form-control" id="lon" name="lon"
                                       placeholder="Longitude (e.g. 21.0122)" required>
                            </div>
                        </div>

                        <div id="geoError" class="alert alert-warning" style="display:none;">
                            Could not get your location. Please enter coordinates manually.
                        </div>

                        <div class="form-row">
                            <div class="col-md-6 mb-2">
                                <button type="button" class="btn btn-secondary btn-block"
                                        onclick="getLocation()">
                                    📍 Use My Location
                                </button>
                            </div>
                        </div>
                    </form>

                    <div id="loadingMsg" class="alert alert-info mt-3" style="display:none;">
                        🔍 Finding cafés nearby and checking the sun...
                    </div>

                    <div id="map" style="height: 500px; width: 100%; border-radius: 8px;
                                         margin-top: 20px; display:none;"></div>

                    <div id="legend" class="mt-3" style="display:none;">
                        <span class="mr-3">
                            <span style="display:inline-block; width:14px; height:14px;
                                         background:green; border-radius:50%;
                                         border:2px solid white; box-shadow:0 0 4px rgba(0,0,0,0.4);
                                         vertical-align:middle;">
                            </span>
                            ☀️ Sunny (cloudiness &lt; 15%)
                        </span>
                        <span>
                            <span style="display:inline-block; width:14px; height:14px;
                                         background:grey; border-radius:50%;
                                         border:2px solid white; box-shadow:0 0 4px rgba(0,0,0,0.4);
                                         vertical-align:middle;">
                            </span>
                            🌥️ Too cloudy
                        </span>
                    </div>

                    <div id="cafeTable" class="mt-4" style="display:none;">
                        <h5>Cafés nearby</h5>
                        <table class="table table-bordered table-sm">
                            <thead class="thead-light">
                                <tr>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th>Address</th>
                                    <th>Favourite</th>
                                    <th>Sun Status</th>
                                    <th>Edit</th>
                                </tr>
                            </thead>
                            <tbody id="cafeList"></tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Description Popup -->
<div class="modal fade" id="editDescriptionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Edit Café Description</h5>
                <button type="button" class="close" data-dismiss="modal">
                    &times;
                </button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="editCafeId">

                <label>Café Name</label>
                <input type="text"
                       id="editCafeName"
                       class="form-control mb-3"
                       readonly>

                <label>Description</label>
                <textarea id="editCafeDescription"
                          class="form-control"
                          rows="4"
                          placeholder="Write a description..."></textarea>

            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary"
                        data-dismiss="modal">
                    Cancel
                </button>

                <button class="btn btn-primary"
                        onclick="saveDescription()">
                    Save
                </button>
            </div>

        </div>
    </div>
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="/functions.js"></script>

</body>
</html>
